name: Release CI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/shared-checks.yml

  verify-version:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify release tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Release tag must be vMAJOR.MINOR.PATCH, got {tag!r}")
          expected = tag[1:]
          python_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          cargo_version = tomllib.loads(Path("rust/Cargo.toml").read_text())["package"]["version"]
          if python_version != expected or cargo_version != expected:
              raise SystemExit(
                  f"Tag {tag} requires both package versions to be {expected}; "
                  f"found Python {python_version} and Cargo {cargo_version}"
              )
          print(f"Release versions match {tag}")
          PY

  publish-pypi:
    runs-on: ubuntu-latest
    needs: verify-version
    environment:
      name: pypi
      url: https://pypi.org/p/spark-ddl-parser
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-cargo:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked --manifest-path rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
