[package]
name = "spark-ddl-parser"
version = "0.2.0"
rust-version = "1.78"
edition = "2021"
description = "Zero-dependency PySpark DDL schema parser"
license = "MIT"
authors = ["Odos Matthews <odosmatthews@gmail.com>"]
repository = "https://github.com/eddiethedean/spark-ddl-parser"
homepage = "https://github.com/eddiethedean/spark-ddl-parser"
readme = "README.md"
keywords = ["spark", "pyspark", "ddl", "schema", "parser"]
categories = ["data-structures", "parser-implementations"]
exclude = ["target", "Cargo.toml.orig"]

[lib]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", optional = true, features = ["derive"] }
